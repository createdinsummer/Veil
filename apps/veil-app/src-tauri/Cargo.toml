[package]
name = "veil-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lib]
name = "veil_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
veil-service = { path = "../../../crates/veil-service" }

[workspace]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
