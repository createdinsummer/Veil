name: VeilIOS
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.veil.ios
    CODE_SIGN_STYLE: Automatic
    SWIFT_OBJC_BRIDGING_HEADER: Sources/veil_bridge.h
    LIBRARY_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../../target/$(RUST_TARGET)/release'
    OTHER_LDFLAGS:
      - '$(inherited)'
      - '$(SRCROOT)/../../target/$(RUST_TARGET)/release/libveil_macos_bridge.a'
      - '-lc++'
      - '-lresolv'
    RUST_TARGET[sdk=iphonesimulator*]: aarch64-apple-ios-sim
    RUST_TARGET[sdk=iphoneos*]: aarch64-apple-ios
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Veil
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  VeilIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: Veil
