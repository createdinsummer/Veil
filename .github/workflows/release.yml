name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # 触发条件：推送 v1.0.0 这样的标签

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: veil

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: veil

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: veil

          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: veil

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: veil.exe

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装交叉编译工具 (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: 配置交叉编译 (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: 构建 veil-cli
        run: |
          cargo build --release --package veil-cli --target ${{ matrix.target }}

      - name: 构建 veil-brute-force
        run: |
          cargo build --release --package veil-brute-force --target ${{ matrix.target }}

      - name: 打包 (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release

          # 打包 veil-cli
          tar czf veil-cli-${{ matrix.target }}.tar.gz veil

          # 打包 veil-brute-force
          tar czf veil-brute-force-${{ matrix.target }}.tar.gz veil-brute-force

          # 计算校验和
          shasum -a 256 veil-cli-${{ matrix.target }}.tar.gz > veil-cli-${{ matrix.target }}.tar.gz.sha256
          shasum -a 256 veil-brute-force-${{ matrix.target }}.tar.gz > veil-brute-force-${{ matrix.target }}.tar.gz.sha256

      - name: 打包 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release

          # 打包 veil-cli
          Compress-Archive -Path veil.exe -DestinationPath veil-cli-${{ matrix.target }}.zip

          # 打包 veil-brute-force
          Compress-Archive -Path veil-brute-force.exe -DestinationPath veil-brute-force-${{ matrix.target }}.zip

          # 计算校验和
          (Get-FileHash veil-cli-${{ matrix.target }}.zip -Algorithm SHA256).Hash | Out-File -Encoding ASCII veil-cli-${{ matrix.target }}.zip.sha256
          (Get-FileHash veil-brute-force-${{ matrix.target }}.zip -Algorithm SHA256).Hash | Out-File -Encoding ASCII veil-brute-force-${{ matrix.target }}.zip.sha256

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: veil-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/*.tar.gz
            target/${{ matrix.target }}/release/*.tar.gz.sha256
            target/${{ matrix.target }}/release/*.zip
            target/${{ matrix.target }}/release/*.zip.sha256

  release:
    name: 创建 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理发布文件
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -lh release/

      - name: 生成 Release Notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cat > release-notes.md <<EOF
          # Veil ${VERSION}

          一个简单、安全、高效的文件加密容器工具。

          ## 📦 下载说明

          ### veil-cli - 命令行工具

          选择适合你系统的版本下载：

          - **macOS Intel**: \`veil-cli-x86_64-apple-darwin.tar.gz\`
          - **macOS Apple Silicon**: \`veil-cli-aarch64-apple-darwin.tar.gz\`
          - **Linux x86_64**: \`veil-cli-x86_64-unknown-linux-gnu.tar.gz\`
          - **Linux ARM64**: \`veil-cli-aarch64-unknown-linux-gnu.tar.gz\`
          - **Windows x86_64**: \`veil-cli-x86_64-pc-windows-msvc.zip\`

          ### veil-brute-force - 密码强度测试工具

          ⚠️ **仅供教育和安全测试目的**

          - **macOS Intel**: \`veil-brute-force-x86_64-apple-darwin.tar.gz\`
          - **macOS Apple Silicon**: \`veil-brute-force-aarch64-apple-darwin.tar.gz\`
          - **Linux x86_64**: \`veil-brute-force-x86_64-unknown-linux-gnu.tar.gz\`
          - **Linux ARM64**: \`veil-brute-force-aarch64-unknown-linux-gnu.tar.gz\`
          - **Windows x86_64**: \`veil-brute-force-x86_64-pc-windows-msvc.zip\`

          ## 📝 安装方法

          ### macOS / Linux

          \`\`\`bash
          # 解压
          tar xzf veil-cli-*.tar.gz

          # 移动到系统路径
          sudo mv veil /usr/local/bin/

          # 验证安装
          veil --version
          \`\`\`

          ### Windows

          1. 解压 zip 文件
          2. 将 \`veil.exe\` 移动到你的 PATH 目录
          3. 在 PowerShell 中运行 \`veil --version\` 验证

          ## ✅ 校验文件完整性

          每个压缩包都附带 SHA256 校验和文件：

          \`\`\`bash
          # macOS / Linux
          shasum -a 256 -c veil-cli-*.tar.gz.sha256

          # Windows (PowerShell)
          \$hash = (Get-FileHash veil-cli-*.zip -Algorithm SHA256).Hash
          \$expected = Get-Content veil-cli-*.zip.sha256
          \$hash -eq \$expected
          \`\`\`

          ## 📚 使用文档

          - [CLI 文档](https://github.com/\${{ github.repository }}/blob/main/crates/veil-cli/README.md)
          - [核心文档](https://github.com/\${{ github.repository }}/blob/main/crates/veil-core/README.md)
          - [暴力破解工具文档](https://github.com/\${{ github.repository }}/blob/main/crates/veil-brute-force/README.md)

          ## 🐛 反馈问题

          如有问题请在 [Issues](https://github.com/\${{ github.repository }}/issues) 中反馈。
          EOF

          cat release-notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release-notes.md
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
