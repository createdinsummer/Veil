name: SQLite storage
on:
  push:
  pull_request:
jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo test -p veil-core -p veil-service -p veil-cli -p veil-brute-force --features veil-service/fault-injection
      - run: cargo fmt --all -- --check
