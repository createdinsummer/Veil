[package]
name = "veil-macos-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
veil-service = { path = "../veil-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.9"

[dev-dependencies]
tempfile = "3.8"
veil-core = { path = "../veil-core" }
