[package]
name = "veil-scrollshot"
version.workspace = true
edition.workspace = true
description = "将垂直滚动录屏拼接为长截图的独立库和命令行程序"
license = "Apache-2.0"

[lib]
name = "veil_scrollshot"

[[bin]]
name = "veil-scrollshot"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
png = "0.18"
tempfile = "3.8"
