[package]
name = "veil-service"
edition.workspace = true
version.workspace = true
rust-version = "1.89"

[dependencies]
veil-core = { path = "../veil-core" }
blake3 = "1.8.5"
chrono = "0.4"
dirs = "5.0"
getrandom = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
walkdir = "2"
zeroize = "1.9.0"

[dev-dependencies]
veil-core = { path = "../veil-core", features = ["fault-injection"] }
tempfile = "3.8"
serde_json = "1"
