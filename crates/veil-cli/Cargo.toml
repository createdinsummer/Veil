[package]
name = "veil-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "veil"
path = "src/main.rs"

[dependencies]
# 核心库
veil-core = { path = "../veil-core" }

# CLI 框架
clap = { version = "4.5", features = ["derive", "cargo"] }

# 密码输入
rpassword = "7.3"

# 加密库（与 core 保持一致）
age = { version = "0.12", features = ["cli-common"] }

# 错误处理
anyhow = "1.0"

# 彩色输出
colored = "2.1"

# 进度条
indicatif = "0.17"

# JSON 解析（用于 i18n）
serde_json = "1.0"

# 文件遍历（用于进度条统计）
walkdir = "2.4"

# 时间处理
chrono = "0.4"

# 加密相关（用于 unpack）
chacha20poly1305 = "0.10"
zeroize = "1.9"

# Windows 控制台 API（用于编码检测和转换）
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "winnls", "processenv", "stringapiset"] }

[dev-dependencies]
# 测试框架
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
