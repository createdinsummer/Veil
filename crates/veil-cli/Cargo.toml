[package]
name = "veil-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "veil"
path = "src/main.rs"

[dependencies]
# 核心库
veil-core = { path = "../veil-core" }

# CLI 框架
clap = { version = "4.5", features = ["derive", "cargo"] }

# 密码输入
rpassword = "7.3"

# 加密库（与 core 保持一致）
age = { version = "0.11", features = ["cli-common"] }

# 错误处理
anyhow = "1.0"

# 彩色输出
colored = "2.1"

# 进度条
indicatif = "0.17"

# 文件遍历（用于进度条统计）
walkdir = "2.4"

[dev-dependencies]
# 测试框架
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
