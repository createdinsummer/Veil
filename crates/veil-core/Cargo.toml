[package]
name = "veil-core"
edition.workspace = true # 从工作空间继承edition
version.workspace = true # 从工作空间继承version

[dependencies]
age = "0.12.1"
argon2 = "0.5"
blake3 = "1.8.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
glob = "0.3.2"
num_cpus = "1.16"
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.10"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
zeroize = "1.9.0"
