[package]
name = "veil-core"
edition.workspace = true # 从工作空间继承edition
version.workspace = true # 从工作空间继承version

[dependencies]
age = "0.12.1"
argon2 = "0.5"
blake3 = "1.8.5"
chacha20poly1305 = "0.10"
chrono = "0.4"
dirs = "5.0"
getrandom = "0.2"
glob = "0.3.2"
hex = "0.4"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.8"
thiserror = "2.0.18"
toml = "0.8"
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
